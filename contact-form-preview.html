<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact form preview</title>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 48px 16px;
        background: #f7f7f8;
        color: rgb(34, 34, 34);
      }
      .preview-shell {
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 32px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .preview-sub {
        color: #6b7280;
        margin: 0 0 24px;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <h1>Get in touch</h1>
      <p class="preview-sub">
        Send us your enquiry and we will get back to you shortly. This is the
        local preview of the form that lives on plasmadesign.co.uk/support.
      </p>
      <div data-plasma-contact-form></div>
    </div>
    <script type="module" src="/src/contact-form/main.ts"></script>
  </body>
</html>
