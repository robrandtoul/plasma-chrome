<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Editorial type stack for the customer-facing proof page.
         Cormorant Garamond as the display serif (hero + section
         headings), Inter Tight as the body sans, Geist Mono for
         pricing numerals (plain undecorated zero — chosen over
         JetBrains Mono so 0 cannot be mistaken for 8 at small
         sizes), Red Hat Mono for uppercase labels and section
         markers. Weights kept light to keep bundle cheap;
         italic ital is loaded for Cormorant since the company-
         name subtitle in the hero uses it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Red+Hat+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <title>Proof Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
