<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPad/iPhone Home Screen icon: the PlasmaWordmark layers mark
         (ink square + white layers glyph) rendered to a 180x180 PNG.
         iOS rounds the corners itself, so the PNG is a full-bleed
         square. apple-mobile-web-app-* make a saved shortcut open
         chrome-free with a dark status bar and a short title. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Proof Viewer" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom-on-focus on
         form fields (the cause of the page-zoom + horizontal-scroll
         issue when tapping into the quote compiler's inputs). iOS
         10+ ignores user-scalable=no for accessibility, so an
         intentional pinch-zoom still works. interactive-widget
         keeps the layout viewport stable when the soft keyboard
         appears so focused inputs don't shove the page sideways.
         viewport-fit=cover lets full-bleed bands (e.g. the customer
         page's dark header) reach the physical screen edges in
         landscape instead of Safari insetting the whole page by the
         safe area; the `.px-gutter` utility then keeps content clear
         of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content, viewport-fit=cover" />
    <!-- Type families (IBM Plex Sans + IBM Plex Mono) load via the
         @import inside src/styles/design-tokens.css. No <link> tags
         needed here. -->
    <title>Proof Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
