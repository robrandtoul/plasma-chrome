<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPad/iPhone Home Screen icon: the PlasmaWordmark layers mark
         (ink square + white layers glyph) rendered to a 180x180 PNG.
         iOS rounds the corners itself, so the PNG is a full-bleed
         square. apple-mobile-web-app-* make a saved shortcut open
         chrome-free with a short title. The status-bar style is
         `default` (adaptive) rather than `black-translucent` — the
         latter rendered as a solid black strip behind the Dynamic
         Island on the installed app instead of letting the page
         colour reach the top edge the way Safari does. With
         `default`, iOS colours the reserved status-bar strip by the
         PHONE's light/dark setting, so in dark mode it painted a dark
         band above the always-cream app. The per-scheme `theme-color`
         tags below pin that strip to cream in BOTH light and dark, and
         the `color-scheme: light` meta (mirrored in CSS) additionally
         declares the app light-only so native controls stay light too
         — together they keep the strip cream with dark text even when
         the phone is in dark mode. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Web App Manifest: makes the app installable as a PWA and is a
         prerequisite for web-push on iOS. The Apple meta tags below still
         drive the iOS Home Screen icon/title; the manifest adds the
         standalone display + theme colour Chrome/Android read. -->
    <link rel="manifest" href="/manifest.json" />
    <!-- theme-color drives the installed-PWA status-bar strip on iOS
         (Safari 15+ reads the meta AND its prefers-color-scheme media
         variant). The app is cream in every state, so pin BOTH schemes
         to the same cream. An installed app opened in dark mode was
         falling back to a system-dark strip because only an
         unconditional theme-color was present; giving iOS an explicit
         dark-scheme value stops it reaching for its own dark default.
         The plain fallback (last) covers anything that ignores the
         media attribute and the pre-load splash, which reads the
         manifest's theme_color (also cream). -->
    <meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf7f0" />
    <!-- Also declare the app light-only so iOS keeps native form
         controls, scrollbars and status-bar text in their light
         treatment even when the phone is in dark mode (mirrored in CSS,
         see design-tokens.css). -->
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Proof Viewer" />
    <!-- maximum-scale=1 stops iOS Safari's auto-zoom-on-focus on
         form fields (the cause of the page-zoom + horizontal-scroll
         issue when tapping into the quote compiler's inputs). iOS
         10+ ignores user-scalable=no for accessibility, so an
         intentional pinch-zoom still works. interactive-widget
         keeps the layout viewport stable when the soft keyboard
         appears so focused inputs don't shove the page sideways.
         viewport-fit=cover lets full-bleed bands (e.g. the customer
         page's dark header) reach the physical screen edges in
         landscape instead of Safari insetting the whole page by the
         safe area; the `.px-gutter` utility then keeps content clear
         of the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, interactive-widget=resizes-content, viewport-fit=cover" />
    <!-- Type families (IBM Plex Sans + IBM Plex Mono) load via the
         @import inside src/styles/design-tokens.css. No <link> tags
         needed here. -->
    <title>Proof Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
